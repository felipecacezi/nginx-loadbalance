version: '3.8'

services:
  web:
    container_name: nginx-server
    image: nginx:latest
    ports:
      - "8080:80"
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  application1:
    container_name: app1
    image: node:lts-alpine
    volumes:
      - ./app1:/usr/src/app
    ports:
      - "3000:3000"
    command: sh -c "cd /usr/src/app && npm install && npm run start"
  application2:
    container_name: app2
    volumes:
      - ./app2:/usr/src/app
    image: node:lts-alpine
    ports:
      - "3001:3000"
    command: sh -c "cd /usr/src/app && npm install && npm run start"
  application3:
    container_name: app3
    volumes:
      - ./app3:/usr/src/app
    image: node:lts-alpine
    ports:
      - "3002:3000"
    command: sh -c "cd /usr/src/app && npm install && npm run start"